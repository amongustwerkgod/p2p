name: CI/CD Pipeline – Build, Security & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ─────────────────────────────────────────────
# PERMISSIONS – least-privilege principle
# ─────────────────────────────────────────────
permissions:
  contents: write       # Needed for GitHub Release
  security-events: write   # Required by CodeQL / SARIF upload
  actions: read

jobs:

  # ════════════════════════════════════════════
  # JOB 1 – SECRET SCANNING (Gitleaks)
  # Runs first so we fail fast if creds leak
  # ════════════════════════════════════════════
  secret-scan:
    name: 🔐 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Full history needed for git-log scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Gitleaks scans every commit in the push for hardcoded secrets,
        # API keys, passwords, tokens, etc. Fails the pipeline if found.

  # ════════════════════════════════════════════
  # JOB 2 – SAST: Static Application Security Testing (CodeQL)
  # Analyses Java source for vulnerabilities
  # ════════════════════════════════════════════
  sast:
    name: 🔍 SAST – CodeQL Analysis
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual
          # CodeQL understands Java/Android; it will detect SQLi, path traversal,
          # insecure deserialization, intent injection, and more.

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Inject google-services.json from Secret
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
    
      - name: Build for CodeQL (debug, no signing needed)
        run: ./gradlew assembleDebug --no-daemon
        # CodeQL autobuild needs the project to compile to trace the call graph

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
        # Results are uploaded to GitHub Security → Code Scanning tab as SARIF

 # ════════════════════════════════════════════
  # JOB 3 – DEPENDENCY AUDIT (OWASP)
  # Checks all Gradle dependencies for known CVEs
  # ════════════════════════════════════════════
  dependency-check:
    name: 📦 Dependency Vulnerability Scan (OWASP)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'p2p'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --failOnCVSS 7
            --out reports
        # Compares every library against the NVD CVE database.

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: reports/


  # ════════════════════════════════════════════
  # JOB 4 – BUILD & TEST
  # ════════════════════════════════════════════
  build-test:
    name: 🏗️ Build & Unit Test
    runs-on: ubuntu-latest
    needs: [sast, dependency-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ... (setup JDK, cache, gradlew, google-services.json)

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      # ─────────────────────────────────────────────
      # NEW STEP: SIGN THE RELEASE APK
      # ─────────────────────────────────────────────
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Peerly-Signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

  # ════════════════════════════════════════════
  # JOB 5 – DEPLOY (GitHub Release)
  # ════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy – Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Signed APK
        uses: actions/download-artifact@v4
        with:
          name: Peerly-Signed
          path: apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # ... (release configuration)
          files: apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
